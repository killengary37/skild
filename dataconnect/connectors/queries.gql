query GetSkills($searchTerm: String = "", $limit: Int = 10, $offset: Int = 0) @auth(level: PUBLIC
insecureReason: "Skills should be visible to everyone") {
  skills(
    where: {
      _or: [
        { title: { contains: $searchTerm }}
        { description: { contains: $searchTerm }}
      ]
    },
    orderBy: [ {
      createdAt: DESC
    }],
    limit: $limit,
    offset: $offset,
  ) {
    id title description tags createdAt installCommand
    author { username imageUrl clerkId email }
  }
}



# 1. **Limit** Specifies the page size - how many records to fetch in this request
# 2. **Offset**: Specifies which "page" of results to return by skipping records

